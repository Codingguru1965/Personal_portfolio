<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="recCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="recAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#recBg)"/>

  <!-- Browser Header Bar -->
  <rect x="40" y="30" width="720" height="38" rx="8" fill="#1E293B"/>
  <circle cx="65" cy="49" r="6" fill="#EF4444"/>
  <circle cx="85" cy="49" r="6" fill="#F59E0B"/>
  <circle cx="105" cy="49" r="6" fill="#10B981"/>
  <rect x="135" y="40" width="340" height="18" rx="4" fill="#334155"/>
  <text x="145" y="53" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">https://github.com/Codingguru1965/RecruiteX</text>

  <!-- App Main Content Area -->
  <rect x="40" y="68" width="720" height="352" rx="4" fill="#0B132B"/>

  <!-- App Header / Navbar -->
  <rect x="40" y="68" width="720" height="50" fill="#1E293B"/>
  <rect x="65" y="81" width="24" height="24" rx="6" fill="url(#recAccent)"/>
  <text x="98" y="98" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="16">RecruiteX</text>
  <text x="175" y="98" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HIRING PORTAL</text>
  <rect x="610" y="79" width="120" height="28" rx="6" fill="url(#recAccent)"/>
  <text x="642" y="97" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Post a Job</text>

  <!-- Search / Filter Bar -->
  <rect x="65" y="135" width="670" height="44" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="85" y="161" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">🔍  Search job titles, candidates, tech stacks (React, Node, TypeScript...)</text>
  <rect x="625" y="141" width="100" height="32" rx="6" fill="#2563EB"/>
  <text x="652" y="161" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Search</text>

  <!-- Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(65, 200)">
    <rect width="210" height="195" rx="10" fill="url(#recCard)" stroke="#475569" stroke-width="1"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#2563EB" opacity="0.2"/>
    <text x="25" y="38" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="18" font-weight="700">JS</text>
    <text x="60" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Senior Frontend Eng.</text>
    <text x="60" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Tech Innovations • Remote</text>
    
    <text x="15" y="78" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Role: React 19, Redux, TS</text>
    <text x="15" y="96" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Applicants: 24 candidates</text>
    
    <rect x="15" y="115" width="55" height="18" rx="4" fill="#2563EB" opacity="0.3"/>
    <text x="23" y="128" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="600">React.js</text>
    <rect x="75" y="115" width="65" height="18" rx="4" fill="#3B82F6" opacity="0.2"/>
    <text x="82" y="128" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TypeScript</text>

    <rect x="15" y="150" width="180" height="30" rx="6" fill="#2563EB"/>
    <text x="75" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Details</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(295, 200)">
    <rect width="210" height="195" rx="10" fill="url(#recCard)" stroke="#475569" stroke-width="1"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#10B981" opacity="0.2"/>
    <text x="25" y="38" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">FS</text>
    <text x="60" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Full Stack MERN Dev</text>
    <text x="60" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Cloud Systems • Hybrid</text>
    
    <text x="15" y="78" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Role: Node, Express, Mongo</text>
    <text x="15" y="96" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Applicants: 18 candidates</text>
    
    <rect x="15" y="115" width="55" height="18" rx="4" fill="#10B981" opacity="0.3"/>
    <text x="22" y="128" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Node.js</text>
    <rect x="75" y="115" width="60" height="18" rx="4" fill="#10B981" opacity="0.2"/>
    <text x="82" y="128" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Express</text>

    <rect x="15" y="150" width="180" height="30" rx="6" fill="#10B981"/>
    <text x="75" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Details</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(525, 200)">
    <rect width="210" height="195" rx="10" fill="url(#recCard)" stroke="#475569" stroke-width="1"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#8B5CF6" opacity="0.2"/>
    <text x="25" y="38" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="18" font-weight="700">DB</text>
    <text x="60" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Backend API Architect</text>
    <text x="60" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">DataCore • Remote</text>
    
    <text x="15" y="78" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Role: PostgreSQL, REST APIs</text>
    <text x="15" y="96" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Applicants: 12 candidates</text>
    
    <rect x="15" y="115" width="65" height="18" rx="4" fill="#8B5CF6" opacity="0.3"/>
    <text x="21" y="128" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PostgreSQL</text>
    <rect x="85" y="115" width="55" height="18" rx="4" fill="#8B5CF6" opacity="0.2"/>
    <text x="94" y="128" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="600">JWT</text>

    <rect x="15" y="150" width="180" height="30" rx="6" fill="#8B5CF6"/>
    <text x="75" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Details</text>
  </g>
</svg>
